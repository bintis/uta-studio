[package]
name = "uta-studio-audio"
version = "0.4.0"
description = "Native editor audition runtime for Uta Studio."
authors = ["bintis"]
license = "GPL-3.0"
edition = "2024"

[dependencies]
app-core = { package = "uta-studio-core", path = "../app-core" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
