[workspace]
resolver = "3"
exclude = ["vendor/parley"]
members = [
  "analysis-engine",
  "app-core",
  "desktop",
  "native-audio",
  "model-settings",
  "runtime-manager",
  "fusion-agent-adapter",
  "native-inference/audio-reuse",
  "native-inference/ggml-runtime",
  "native-inference/libtorch-runtime",
  "native-inference/ggml-worker",
  "native-inference/gpu-probes",
  "studio-chart",
  "studio-diagnostics",
  "xtask",
  "utz-export",
]

# UTZ is the published output standard, used unmodified from upstream. Studio's
# internal chart model lives in studio-chart and is projected to it on export.
[workspace.dependencies]
utz = { git = "https://github.com/bintis/utz", rev = "cf1c09af3decd870a09a226ec0ead1811c52459f" }

# Parley keeps its segmentation constructors private. Carry the minimal source
# fix here so packaged desktop builds load ICU's compiled CJK dictionaries;
# changing the registry cache or suppressing ICU errors would not fix layout.
[patch.crates-io]
parley = { path = "vendor/parley" }
