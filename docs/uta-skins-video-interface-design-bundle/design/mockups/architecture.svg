<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<title>uta! architecture</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/>
    <stop offset="0.55" stop-color="#111A31"/>
    <stop offset="1" stop-color="#24163B"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121A2D"/>
    <stop offset="1" stop-color="#0B1020"/>
  </linearGradient>
  <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#56B4E9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#39D9C6" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#56B4E9" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="2.2"/></filter>
  <pattern id="diag" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="12" fill="#FFFFFF" fill-opacity="0.18"/>
  </pattern>
  <style>
    text { font-family: 'Noto Sans CJK SC','Noto Sans CJK JP','Noto Sans',sans-serif; fill:#F4F7FF; }
    .muted { fill:#B9C2D9; }
    .subtle { fill:#7E8AA8; }
    .label { font-size:14px; font-weight:600; letter-spacing:0.4px; }
    .small { font-size:12px; }
  </style>
</defs>
<rect width="1500" height="900" fill="#070B14"/>
<text x="64" y="66" font-size="34" font-weight="900">uta! polish architecture</text>
<text x="64" y="96" font-size="14" class="muted">Native skin lookups, one gameplay clock, one settings catalogue, structured diagnostics.</text>
