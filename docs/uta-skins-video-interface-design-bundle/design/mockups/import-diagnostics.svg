<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
<title>UTZ import diagnostics mockup</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/>
    <stop offset="0.55" stop-color="#111A31"/>
    <stop offset="1" stop-color="#24163B"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121A2D"/>
    <stop offset="1" stop-color="#0B1020"/>
  </linearGradient>
  <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#56B4E9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#39D9C6" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#56B4E9" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="2.2"/></filter>
  <pattern id="diag" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="12" fill="#FFFFFF" fill-opacity="0.18"/>
  </pattern>
  <style>
    text { font-family: 'Noto Sans CJK SC','Noto Sans CJK JP','Noto Sans',sans-serif; fill:#F4F7FF; }
    .muted { fill:#B9C2D9; }
    .subtle { fill:#7E8AA8; }
    .label { font-size:14px; font-weight:600; letter-spacing:0.4px; }
    .small { font-size:12px; }
  </style>
</defs>
<rect width="1180" height="760" fill="#070B14"/>
<rect x="40" y="34" width="1100" height="692" rx="24" fill="#0B1020" stroke="#33415F"/>
<circle cx="82" cy="82" r="22" fill="#F26B8A"/><text x="82" y="91" text-anchor="middle" font-size="28" font-weight="900" fill="#0B1020">!</text>
<text x="120" y="78" font-size="28" font-weight="900">无法导入 sample-song.utz</text>
<text x="120" y="107" font-size="14" class="muted">发现 3 个错误和 1 个警告。内部堆栈不会显示。</text>
<rect x="72" y="138" width="310" height="82" rx="16" fill="#17162A" stroke="#F26B8A"/><text x="94" y="172" font-size="14" class="muted">错误</text><text x="94" y="204" font-size="30" font-weight="900">3</text>
<rect x="400" y="138" width="310" height="82" rx="16" fill="#201E16" stroke="#F2C94C"/><text x="422" y="172" font-size="14" class="muted">警告</text><text x="422" y="204" font-size="30" font-weight="900">1</text>
<rect x="728" y="138" width="378" height="82" rx="16" fill="#10192B" stroke="#33415F"/><text x="750" y="172" font-size="14" class="muted">包版本</text><text x="750" y="204" font-size="22" font-weight="800">uta.song 0.3.1</text>
<rect x="72" y="246" width="1034" height="88" rx="16" fill="#10192B" stroke="#263450"/>
<rect x="88" y="264" width="92" height="28" rx="14" fill="#F26B8A" fill-opacity="0.16" stroke="#F26B8A"/>
<text x="134" y="284" text-anchor="middle" font-size="13" font-weight="800">UTZ0010</text>
<text x="198" y="280" font-size="15" font-weight="800">压缩包根目录缺少 manifest.json。</text>
<text x="198" y="308" font-size="13" class="muted">建议：请将 manifest.json 放在归档根目录。</text>
<rect x="72" y="344" width="1034" height="88" rx="16" fill="#10192B" stroke="#263450"/>
<rect x="88" y="362" width="92" height="28" rx="14" fill="#F26B8A" fill-opacity="0.16" stroke="#F26B8A"/>
<text x="134" y="382" text-anchor="middle" font-size="13" font-weight="800">UTZ0022</text>
<text x="198" y="378" font-size="15" font-weight="800">资源完整性校验失败：audio/instrumental.flac</text>
<text x="198" y="406" font-size="13" class="muted">建议：重新导出包，或更新 manifest 中的 SHA-256。</text>
<rect x="72" y="442" width="1034" height="88" rx="16" fill="#10192B" stroke="#263450"/>
<rect x="88" y="460" width="92" height="28" rx="14" fill="#F26B8A" fill-opacity="0.16" stroke="#F26B8A"/>
<text x="134" y="480" text-anchor="middle" font-size="13" font-weight="800">UTZ0031</text>
<text x="198" y="476" font-size="15" font-weight="800">目标音符重叠，或未按时间排序。</text>
<text x="198" y="504" font-size="13" class="muted">建议：检查 vocal chart 的 note.start 与 duration。</text>
<rect x="72" y="540" width="1034" height="88" rx="16" fill="#10192B" stroke="#263450"/>
<rect x="88" y="558" width="92" height="28" rx="14" fill="#F2C94C" fill-opacity="0.16" stroke="#F2C94C"/>
<text x="134" y="578" text-anchor="middle" font-size="13" font-weight="800">UTZ0040</text>
<text x="198" y="574" font-size="15" font-weight="800">无法解码 video/main.webm；仍可继续音频游玩。</text>
<text x="198" y="602" font-size="13" class="muted">建议：改用受支持编码，或移除视频资源。</text>
<rect x="72" y="658" width="140" height="42" rx="21" fill="#18233A" stroke="#52617E"/><text x="142" y="685" text-anchor="middle" font-size="14" font-weight="700">复制报告</text>
<rect x="938" y="658" width="168" height="42" rx="21" fill="#B899FF"/><text x="1022" y="685" text-anchor="middle" font-size="14" font-weight="900" fill="#0B1020">关闭</text>
</svg>