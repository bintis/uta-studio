<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<title>uta! two-level settings desktop</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B14"/>
    <stop offset="0.55" stop-color="#111A31"/>
    <stop offset="1" stop-color="#24163B"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121A2D"/>
    <stop offset="1" stop-color="#0B1020"/>
  </linearGradient>
  <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#56B4E9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#39D9C6" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#56B4E9" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="2.2"/></filter>
  <pattern id="diag" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="5" height="12" fill="#FFFFFF" fill-opacity="0.18"/>
  </pattern>
  <style>
    text { font-family: 'Noto Sans CJK SC','Noto Sans CJK JP','Noto Sans',sans-serif; fill:#F4F7FF; }
    .muted { fill:#B9C2D9; }
    .subtle { fill:#7E8AA8; }
    .label { font-size:14px; font-weight:600; letter-spacing:0.4px; }
    .small { font-size:12px; }
  </style>
</defs>
<rect width="1440" height="900" fill="#070B14"/>
<rect x="34" y="28" width="1372" height="844" rx="24" fill="#0B1020" stroke="#33415F"/>
<text x="72" y="82" font-size="30" font-weight="900">uta! 设置</text>
<rect x="1010" y="50" width="350" height="48" rx="24" fill="#121A2D" stroke="#33415F"/>
<text x="1040" y="80" font-size="15" class="muted">搜索视频、歌词、延迟、粒子…</text>
<rect x="58" y="122" width="286" height="720" rx="18" fill="#0E1628"/>
<circle cx="96" cy="158" r="7" fill="#7E8AA8"/>
<text x="116" y="164" font-size="17" font-weight="600" class="muted">玩法与 HUD</text>
<rect x="74" y="206" width="254" height="54" rx="14" fill="#201B3A" stroke="#B899FF"/>
<circle cx="96" cy="232" r="7" fill="#B899FF"/>
<text x="116" y="238" font-size="17" font-weight="800" class="">视频与视觉</text>
<circle cx="96" cy="306" r="7" fill="#7E8AA8"/>
<text x="116" y="312" font-size="17" font-weight="600" class="muted">音频与麦克风</text>
<circle cx="96" cy="380" r="7" fill="#7E8AA8"/>
<text x="116" y="386" font-size="17" font-weight="600" class="muted">练习与控制</text>
<circle cx="96" cy="454" r="7" fill="#7E8AA8"/>
<text x="116" y="460" font-size="17" font-weight="600" class="muted">无障碍</text>
<circle cx="96" cy="528" r="7" fill="#7E8AA8"/>
<text x="116" y="534" font-size="17" font-weight="600" class="muted">诊断与存储</text>
<text x="388" y="146" font-size="28" font-weight="900">视频与视觉</text>
<text x="388" y="177" font-size="14" class="muted">所有设置都包含搜索词、提示、单项重置和不可用原因。</text>
<g opacity="1"><rect x="382" y="214" width="980" height="78" rx="15" fill="#10192B" stroke="#263450"/>
<text x="406" y="245" font-size="17" font-weight="800">视频可见性</text>
<text x="406" y="270" font-size="13" class="muted">根据歌曲是否包含视频自动显示。</text>
<rect x="1120" y="232" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="259" text-anchor="middle" font-size="15" font-weight="700">自动</text>
<circle cx="1330" cy="253" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 253 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<g opacity="1"><rect x="382" y="302" width="980" height="78" rx="15" fill="#10192B" stroke="#263450"/>
<text x="406" y="333" font-size="17" font-weight="800">视频变暗</text>
<text x="406" y="358" font-size="13" class="muted">降低歌词和音高图后方视频亮度。</text>
<rect x="1120" y="320" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="347" text-anchor="middle" font-size="15" font-weight="700">35%</text>
<circle cx="1330" cy="341" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 341 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<g opacity="1"><rect x="382" y="390" width="980" height="78" rx="15" fill="#10192B" stroke="#263450"/>
<text x="406" y="421" font-size="17" font-weight="800">视频模糊</text>
<text x="406" y="446" font-size="13" class="muted">减少动态视频与玩法信息的视觉竞争。</text>
<rect x="1120" y="408" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="435" text-anchor="middle" font-size="15" font-weight="700">0 px</text>
<circle cx="1330" cy="429" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 429 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<g opacity="1"><rect x="382" y="478" width="980" height="78" rx="15" fill="#10192B" stroke="#263450"/>
<text x="406" y="509" font-size="17" font-weight="800">视频偏移</text>
<text x="406" y="534" font-size="13" class="muted">正值在相同歌曲时间点播放更靠后的视频画面。</text>
<rect x="1120" y="496" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="523" text-anchor="middle" font-size="15" font-weight="700">+120 ms</text>
<circle cx="1330" cy="517" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 517 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<g opacity="1"><rect x="382" y="566" width="980" height="78" rx="15" fill="#10192B" stroke="#263450"/>
<text x="406" y="597" font-size="17" font-weight="800">皮肤动画强度</text>
<text x="406" y="622" font-size="13" class="muted">缩放皮肤请求的脉冲、发光与移动。</text>
<rect x="1120" y="584" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="611" text-anchor="middle" font-size="15" font-weight="700">65%</text>
<circle cx="1330" cy="605" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 605 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<g opacity="1"><rect x="382" y="654" width="980" height="78" rx="15" fill="#10192B" stroke="#263450"/>
<text x="406" y="685" font-size="17" font-weight="800">演唱粒子</text>
<text x="406" y="710" font-size="13" class="muted">检测到稳定人声时显示轻量粒子。</text>
<rect x="1120" y="672" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="699" text-anchor="middle" font-size="15" font-weight="700">开</text>
<circle cx="1330" cy="693" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 693 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<g opacity="0.62"><rect x="382" y="742" width="980" height="78" rx="15" fill="#0C1322" stroke="#263450"/>
<text x="406" y="773" font-size="17" font-weight="800">评分粒子</text>
<text x="406" y="798" font-size="13" class="muted">Relax 已禁用评分，因此不会生成评分粒子。</text>
<rect x="1120" y="760" width="176" height="42" rx="21" fill="#18233A" stroke="#33415F"/>
<text x="1208" y="787" text-anchor="middle" font-size="15" font-weight="700">不可用</text>
<circle cx="1330" cy="781" r="15" fill="#18233A" stroke="#52617E"/>
<path d="M1324 781 a6 6 0 1 0 6 -6" fill="none" stroke="#B9C2D9" stroke-width="2"/></g>
<rect x="382" y="834" width="980" height="62" rx="15" fill="#201B3A" stroke="#B899FF"/>
<text x="406" y="861" font-size="14" font-weight="800">对比度保护：开启（关键玩法提示不可完全关闭）</text>
<text x="406" y="882" font-size="12" class="muted">低对比皮肤颜色会保留中性轮廓、纹理和文字标签。</text>
</svg>