[package]
name = "uta-studio-core"
version = "0.7.0"
authors = ["bintis"]
edition = "2024"

[lib]
name = "app_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
walkdir = "2"
blake3 = "1"
sha2 = "0.10"
lofty = "0.25"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
tracing = "0.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
utz = { path = "../vendor/utz" }

[build-dependencies]
dotenvy = "0.15"
