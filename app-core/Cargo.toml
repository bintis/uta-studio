[package]
name = "uta-studio-core"
version = "0.8.4"
authors = ["bintis"]
edition = "2024"

[lib]
name = "app_core"

[dependencies]
uta-model-settings = { path = "../model-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
walkdir = "2"
blake3 = "1"
sha2 = "0.11"
lofty = "0.25"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
tracing = "0.1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
aes = "0.9"
base64 = "0.23"
cipher = "0.5"
flate2 = "1"
hex = "0.4"
md-5 = "0.11"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uta-studio-chart = { path = "../studio-chart" }
utz.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[build-dependencies]
dotenvy = "0.15"
