name: Package release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Read release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify canonical product identity
        run: tools/check-product-identity.sh

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version *= *"/ { print $2; exit }' desktop/Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Could not read version from desktop/Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            .github/scripts/verify-version.sh "$tag_version"
            version="$tag_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging Uta! Studio $version"

  package-linux-portable:
    name: Package self-contained Linux binary
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build packaged application
        run: nix build path:.#uta-studio --print-build-logs

      - name: Show Nix closure size
        shell: bash
        run: |
          set -euo pipefail
          nix path-info -Sh "$(readlink -f result)"

      - name: Build self-contained executable
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          artifact="uta-studio-${version}-x86_64-linux"

          nix bundle \
            --bundler github:NixOS/bundlers#toArx \
            path:.#uta-studio \
            --out-link "$artifact"

          cp --dereference "$artifact" "${artifact}.bin"
          chmod 0755 "${artifact}.bin"
          sha256sum "${artifact}.bin" > "uta-studio-${version}-linux-portable.sha256"
          ls -lh "${artifact}.bin" "uta-studio-${version}-linux-portable.sha256"

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v4
        with:
          name: uta-studio-${{ needs.metadata.outputs.version }}-linux-portable-package
          path: |
            uta-studio-${{ needs.metadata.outputs.version }}-x86_64-linux.bin
            uta-studio-${{ needs.metadata.outputs.version }}-linux-portable.sha256
          if-no-files-found: error

  package-linux-deb:
    name: Package native DEB
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libudev-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libglvnd-dev \
            libvulkan-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            dpkg-dev \
            binutils \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-deb

      - name: Build native Linux executables
        run: >-
          cargo build --release --locked
          -p uta-studio-desktop -p uta-analysis-engine -p uta-runtime-manager
          -p uta-ggml-worker -p uta-openvino-worker -p uta-qwen-worker

      - name: Verify native executable linkage
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/uta-studio

          file "$binary"
          readelf -l "$binary" | grep 'interpreter' || true
          readelf -d "$binary" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          ldd "$binary" | tee /tmp/uta-studio-ldd.txt

          if grep -q 'not found' /tmp/uta-studio-ldd.txt; then
            echo "The native executable has unresolved shared libraries" >&2
            exit 1
          fi
          if grep -aFq '/nix/store/' "$binary"; then
            echo "The native executable unexpectedly references /nix/store" >&2
            exit 1
          fi

          strip --strip-unneeded "$binary"
          ls -lh "$binary"

      - name: Build DEB package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          package="uta-studio_${version}-1_amd64.deb"
          root="$RUNNER_TEMP/uta-studio-deb-root"
          metadata="$RUNNER_TEMP/uta-studio-deb-metadata"

          rm -rf "$root" "$metadata"
          mkdir -p "$root" "$metadata/debian"

          install -Dm755 target/release/uta-studio \
            "$root/usr/lib/uta-studio/uta-studio"
          install -Dm755 target/release/uta-analyze \
            "$root/usr/bin/uta-analyze"
          install -Dm755 target/release/uta-runtime \
            "$root/usr/bin/uta-runtime"
          install -Dm755 target/release/uta-openvino-worker \
            "$root/usr/bin/uta-openvino-worker"
          install -Dm755 target/release/uta-ggml-worker \
            "$root/usr/bin/uta-ggml-worker"
          install -Dm755 target/release/uta-qwen-asr-worker \
            "$root/usr/bin/uta-qwen-asr-worker"
          install -Dm755 target/release/uta-qwen-align-worker \
            "$root/usr/bin/uta-qwen-align-worker"

          install -Dm644 native-inference/openvino-worker/THIRD_PARTY_NOTICES.md \
            "$root/usr/share/doc/uta-studio/openvino-worker-THIRD_PARTY_NOTICES.md"
          install -Dm644 native-inference/qwen-worker/THIRD_PARTY_NOTICES.md \
            "$root/usr/share/doc/uta-studio/qwen-worker-THIRD_PARTY_NOTICES.md"
          install -Dm644 native-inference/roformer/THIRD_PARTY_NOTICES.md \
            "$root/usr/share/doc/uta-studio/ggml-roformer-THIRD_PARTY_NOTICES.md"

          install -Dm644 icon.png \
            "$root/usr/share/uta-studio/icon.png"
          install -Dm644 desktop/assets/fonts/NotoSansCJKsc-Regular.otf \
            "$root/usr/share/uta-studio/desktop/assets/fonts/NotoSansCJKsc-Regular.otf"
          install -Dm644 desktop/assets/icons/ui-icons.svg \
            "$root/usr/share/uta-studio/desktop/assets/icons/ui-icons.svg"
          install -Dm644 desktop/assets/icons/ui-icons.png \
            "$root/usr/share/uta-studio/desktop/assets/icons/ui-icons.png"
          install -Dm644 desktop/assets/icons/music-placeholder.png \
            "$root/usr/share/uta-studio/desktop/assets/icons/music-placeholder.png"
          install -Dm644 desktop/assets/icons/music-placeholder.svg \
            "$root/usr/share/uta-studio/desktop/assets/icons/music-placeholder.svg"
          install -Dm644 icon.png \
            "$root/usr/share/icons/hicolor/512x512/apps/uta-studio.png"
          install -Dm644 desktop/uta-studio.desktop \
            "$root/usr/share/applications/uta-studio.desktop"
          install -Dm644 LICENSE \
            "$root/usr/share/doc/uta-studio/LICENSE"
          install -d "$root/usr/bin"

          cat > "$root/usr/bin/uta-studio" <<'SH'
          #!/bin/sh
          export UTA_STUDIO_ASSET_PATH=/usr/share/uta-studio
          export UTA_STUDIO_ANALYSIS_CLI_PATH=/usr/bin/uta-analyze
          export UTA_STUDIO_RUNTIME_CLI_PATH=/usr/bin/uta-runtime
          export UTA_STUDIO_OPENVINO_RUNTIME_PATH=/usr/bin/uta-openvino-worker
          export UTA_STUDIO_GGML_RUNTIME_PATH=/usr/bin/uta-ggml-worker
          export UTA_STUDIO_QWEN_ASR_RUNTIME_PATH=/usr/bin/uta-qwen-asr-worker
          export UTA_STUDIO_QWEN_ALIGN_RUNTIME_PATH=/usr/bin/uta-qwen-align-worker
          export WINIT_UNIX_BACKEND=wayland
          exec /usr/lib/uta-studio/uta-studio "$@"
          SH
          chmod 0755 "$root/usr/bin/uta-studio"

          cat > "$metadata/debian/control" <<EOF
          Source: uta-studio
          Section: sound
          Priority: optional
          Maintainer: Uta! Studio contributors <noreply@github.com>
          Standards-Version: 4.7.0

          Package: uta-studio
          Architecture: amd64
          Description: AI-assisted song chart editor
           Native Wayland desktop editor for analysing local songs, correcting
           lyric timing and pitch, and exporting UTZ and UltraStar charts.
          EOF

          pushd "$metadata" >/dev/null
          shlib_deps=$(
            dpkg-shlibdeps -O \
              -e"$root/usr/lib/uta-studio/uta-studio" \
              | sed -n 's/^shlibs:Depends=//p'
          )
          popd >/dev/null

          if [[ -z "$shlib_deps" ]]; then
            echo "dpkg-shlibdeps did not produce dependency metadata" >&2
            exit 1
          fi

          installed_size=$(du -sk "$root" | awk '{print $1}')
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: uta-studio
          Version: ${version}-1
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Uta! Studio contributors <noreply@github.com>
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Installed-Size: ${installed_size}
          Depends: ${shlib_deps}, ca-certificates, ffmpeg, tar, unzip, xz-utils, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav, libegl1, libgles2, libvulkan1
          Recommends: gstreamer1.0-pipewire, xdg-desktop-portal
          Description: AI-assisted song chart editor
           Native Wayland desktop editor for analysing local songs, correcting
           lyric timing and pitch, and exporting UTZ and UltraStar charts.
          EOF

          dpkg-deb --build --root-owner-group "$root" "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | sed -n '1,80p'
          sha256sum "$package" > "uta-studio-${version}-linux-deb.sha256"
          ls -lh "$package" "uta-studio-${version}-linux-deb.sha256"

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: uta-studio-${{ needs.metadata.outputs.version }}-linux-deb-package
          path: |
            uta-studio_${{ needs.metadata.outputs.version }}-1_amd64.deb
            uta-studio-${{ needs.metadata.outputs.version }}-linux-deb.sha256
          if-no-files-found: error

  package-linux-rpm:
    name: Package native RPM
    needs: metadata
    runs-on: ubuntu-24.04
    container:
      image: fedora:43
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Install native build and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            gcc \
            gcc-c++ \
            make \
            pkgconf-pkg-config \
            openssl-devel \
            zlib-devel \
            systemd-devel \
            wayland-devel \
            wayland-protocols-devel \
            libxkbcommon-devel \
            libglvnd-devel \
            vulkan-loader-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            rpm-build \
            rpmdevtools \
            git \
            curl \
            ca-certificates \
            tar \
            gzip \
            xz \
            findutils \
            file \
            binutils
          dnf clean all

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build native Linux executables
        run: >-
          cargo build --release --locked
          -p uta-studio-desktop -p uta-analysis-engine -p uta-runtime-manager
          -p uta-ggml-worker -p uta-openvino-worker -p uta-qwen-worker

      - name: Verify native executable linkage
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/uta-studio

          file "$binary"
          readelf -l "$binary" | grep 'interpreter' || true
          readelf -d "$binary" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          ldd "$binary" | tee /tmp/uta-studio-ldd.txt

          if grep -q 'not found' /tmp/uta-studio-ldd.txt; then
            echo "The native executable has unresolved shared libraries" >&2
            exit 1
          fi
          if grep -aFq '/nix/store/' "$binary"; then
            echo "The native executable unexpectedly references /nix/store" >&2
            exit 1
          fi

          strip --strip-unneeded "$binary"
          ls -lh "$binary"

      - name: Build RPM package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.metadata.outputs.version }}"
          output="uta-studio-${version}-1.x86_64.rpm"
          payload="$RUNNER_TEMP/uta-studio-rpm-payload"
          source_dir="$RUNNER_TEMP/uta-studio-${version}"
          topdir="$RUNNER_TEMP/rpmbuild"

          rm -rf "$payload" "$source_dir" "$topdir"
          mkdir -p "$payload" "$source_dir" \
            "$topdir/BUILD" "$topdir/BUILDROOT" "$topdir/RPMS" \
            "$topdir/SOURCES" "$topdir/SPECS" "$topdir/SRPMS"

          install -Dm755 target/release/uta-studio \
            "$payload/usr/libexec/uta-studio/uta-studio"
          install -Dm755 target/release/uta-analyze \
            "$payload/usr/bin/uta-analyze"
          install -Dm755 target/release/uta-runtime \
            "$payload/usr/bin/uta-runtime"
          install -Dm755 target/release/uta-openvino-worker \
            "$payload/usr/bin/uta-openvino-worker"
          install -Dm755 target/release/uta-ggml-worker \
            "$payload/usr/bin/uta-ggml-worker"
          install -Dm755 target/release/uta-qwen-asr-worker \
            "$payload/usr/bin/uta-qwen-asr-worker"
          install -Dm755 target/release/uta-qwen-align-worker \
            "$payload/usr/bin/uta-qwen-align-worker"
          install -Dm644 native-inference/openvino-worker/THIRD_PARTY_NOTICES.md \
            "$payload/usr/share/licenses/uta-studio/openvino-worker-THIRD_PARTY_NOTICES.md"
          install -Dm644 native-inference/qwen-worker/THIRD_PARTY_NOTICES.md \
            "$payload/usr/share/licenses/uta-studio/qwen-worker-THIRD_PARTY_NOTICES.md"
          install -Dm644 native-inference/roformer/THIRD_PARTY_NOTICES.md \
            "$payload/usr/share/licenses/uta-studio/ggml-roformer-THIRD_PARTY_NOTICES.md"
          install -Dm644 icon.png \
            "$payload/usr/share/uta-studio/icon.png"
          install -Dm644 desktop/assets/fonts/NotoSansCJKsc-Regular.otf \
            "$payload/usr/share/uta-studio/desktop/assets/fonts/NotoSansCJKsc-Regular.otf"
          install -Dm644 desktop/assets/icons/ui-icons.svg \
            "$payload/usr/share/uta-studio/desktop/assets/icons/ui-icons.svg"
          install -Dm644 desktop/assets/icons/ui-icons.png \
            "$payload/usr/share/uta-studio/desktop/assets/icons/ui-icons.png"
          install -Dm644 desktop/assets/icons/music-placeholder.png \
            "$payload/usr/share/uta-studio/desktop/assets/icons/music-placeholder.png"
          install -Dm644 desktop/assets/icons/music-placeholder.svg \
            "$payload/usr/share/uta-studio/desktop/assets/icons/music-placeholder.svg"
          install -Dm644 icon.png \
            "$payload/usr/share/icons/hicolor/512x512/apps/uta-studio.png"
          install -Dm644 desktop/uta-studio.desktop \
            "$payload/usr/share/applications/uta-studio.desktop"
          install -Dm644 LICENSE \
            "$payload/usr/share/licenses/uta-studio/LICENSE"
          install -d "$payload/usr/bin"

          cat > "$payload/usr/bin/uta-studio" <<'SH'
          #!/bin/sh
          export UTA_STUDIO_ASSET_PATH=/usr/share/uta-studio
          export UTA_STUDIO_ANALYSIS_CLI_PATH=/usr/bin/uta-analyze
          export UTA_STUDIO_RUNTIME_CLI_PATH=/usr/bin/uta-runtime
          export UTA_STUDIO_OPENVINO_RUNTIME_PATH=/usr/bin/uta-openvino-worker
          export UTA_STUDIO_GGML_RUNTIME_PATH=/usr/bin/uta-ggml-worker
          export UTA_STUDIO_QWEN_ASR_RUNTIME_PATH=/usr/bin/uta-qwen-asr-worker
          export UTA_STUDIO_QWEN_ALIGN_RUNTIME_PATH=/usr/bin/uta-qwen-align-worker
          export WINIT_UNIX_BACKEND=wayland
          exec /usr/libexec/uta-studio/uta-studio "$@"
          SH
          chmod 0755 "$payload/usr/bin/uta-studio"

          cp -a "$payload" "$source_dir/payload"
          tar -C "$RUNNER_TEMP" -czf \
            "$topdir/SOURCES/uta-studio-${version}.tar.gz" \
            "uta-studio-${version}"

          changelog_date=$(LC_ALL=C date '+%a %b %d %Y')

          cat > "$topdir/SPECS/uta-studio.spec" <<EOF
          %global debug_package %{nil}

          Name:           uta-studio
          Version:        ${version}
          Release:        1
          Summary:        AI-assisted song chart editor
          License:        GPL-3.0-only
          URL:            https://github.com/${GITHUB_REPOSITORY}
          Source0:        %{name}-%{version}.tar.gz
          AutoReqProv:    yes

          Requires:       /usr/bin/ffmpeg
          Requires:       ca-certificates
          Requires:       tar
          Requires:       unzip
          Requires:       xz
          Requires:       gstreamer1-plugins-base
          Requires:       gstreamer1-plugins-good
          Requires:       gstreamer1-plugin-libav
          Requires:       libglvnd-egl
          Requires:       libglvnd-gles
          Requires:       vulkan-loader
          Recommends:     pipewire-gstreamer
          Recommends:     xdg-desktop-portal

          %description
          Native Wayland desktop editor for analysing local songs, correcting
          lyric timing and pitch, and exporting UTZ and UltraStar charts.

          %prep
          %setup -q

          %build

          %install
          rm -rf %{buildroot}
          cp -a payload/. %{buildroot}/

          %files
          %license %{_licensedir}/uta-studio/*
          %{_bindir}/uta-studio
          %{_libexecdir}/uta-studio/
          %{_datadir}/uta-studio/
          %{_datadir}/applications/uta-studio.desktop
          %{_datadir}/icons/hicolor/512x512/apps/uta-studio.png

          %changelog
          * ${changelog_date} Uta! Studio contributors <noreply@github.com> - ${version}-1
          - Native system-dependency package
          EOF

          rpmbuild --define "_topdir $topdir" -bb "$topdir/SPECS/uta-studio.spec"

          rpm_path=$(find "$topdir/RPMS" -type f -name 'uta-studio-*.rpm' -print -quit)
          if [[ -z "$rpm_path" ]]; then
            echo "rpmbuild did not produce an RPM" >&2
            exit 1
          fi

          cp "$rpm_path" "$output"
          rpm -qpi "$output"
          rpm -qpR "$output" | sort
          sha256sum "$output" > "uta-studio-${version}-linux-rpm.sha256"
          ls -lh "$output" "uta-studio-${version}-linux-rpm.sha256"

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: uta-studio-${{ needs.metadata.outputs.version }}-linux-rpm-package
          path: |
            uta-studio-${{ needs.metadata.outputs.version }}-1.x86_64.rpm
            uta-studio-${{ needs.metadata.outputs.version }}-linux-rpm.sha256
          if-no-files-found: error

  package-windows:
    name: Package Windows x86_64
    needs: metadata
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Windows executables
        run: >-
          cargo build --release --locked
          -p uta-studio-desktop -p uta-analysis-engine -p uta-runtime-manager
          -p uta-ggml-worker -p uta-openvino-worker -p uta-qwen-worker

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $root = Join-Path $env:RUNNER_TEMP "uta-studio-$version-windows"
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          New-Item -ItemType Directory -Force "$root/share/uta-studio/desktop/assets/fonts" | Out-Null
          New-Item -ItemType Directory -Force "$root/share/uta-studio/desktop/assets/icons" | Out-Null
          Copy-Item target/release/uta-studio.exe "$root/bin/uta-studio.exe"
          Copy-Item target/release/uta-analyze.exe "$root/bin/uta-analyze.exe"
          Copy-Item target/release/uta-runtime.exe "$root/bin/uta-runtime.exe"
          Copy-Item target/release/uta-openvino-worker.exe "$root/bin/uta-openvino-worker.exe"
          Copy-Item target/release/uta-ggml-worker.exe "$root/bin/uta-ggml-worker.exe"
          Copy-Item target/release/uta-qwen-asr-worker.exe "$root/bin/uta-qwen-asr-worker.exe"
          Copy-Item target/release/uta-qwen-align-worker.exe "$root/bin/uta-qwen-align-worker.exe"
          New-Item -ItemType Directory -Force "$root/share/uta-studio/licenses" | Out-Null
          Copy-Item native-inference/openvino-worker/THIRD_PARTY_NOTICES.md "$root/share/uta-studio/licenses/openvino-worker-THIRD_PARTY_NOTICES.md"
          Copy-Item native-inference/qwen-worker/THIRD_PARTY_NOTICES.md "$root/share/uta-studio/licenses/qwen-worker-THIRD_PARTY_NOTICES.md"
          Copy-Item native-inference/roformer/THIRD_PARTY_NOTICES.md "$root/share/uta-studio/licenses/ggml-roformer-THIRD_PARTY_NOTICES.md"
          Copy-Item icon.png "$root/share/uta-studio/icon.png"
          Copy-Item desktop/assets/fonts/NotoSansCJKsc-Regular.otf "$root/share/uta-studio/desktop/assets/fonts/"
          Copy-Item desktop/assets/icons/ui-icons.svg "$root/share/uta-studio/desktop/assets/icons/"
          Copy-Item desktop/assets/icons/ui-icons.png "$root/share/uta-studio/desktop/assets/icons/"
          Copy-Item desktop/assets/icons/music-placeholder.png "$root/share/uta-studio/desktop/assets/icons/"
          Copy-Item desktop/assets/icons/music-placeholder.svg "$root/share/uta-studio/desktop/assets/icons/"
          Compress-Archive -Path "$root/*" -DestinationPath "uta-studio-$version-x86_64-windows.zip"
          $hash = (Get-FileHash "uta-studio-$version-x86_64-windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  uta-studio-$version-x86_64-windows.zip" |
            Set-Content -NoNewline "uta-studio-$version-windows.sha256"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: uta-studio-${{ needs.metadata.outputs.version }}-windows-package
          path: |
            uta-studio-${{ needs.metadata.outputs.version }}-x86_64-windows.zip
            uta-studio-${{ needs.metadata.outputs.version }}-windows.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - metadata
      - package-linux-portable
      - package-linux-deb
      - package-linux-rpm
      - package-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: uta-studio-*-package
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/extract-changelog-notes.sh "$version" release-notes.md

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
