[package]
name = "uta-studio"
version = "0.1.0"
description = "Uta Studio — AI song generation, chart editing, and interoperable export."
authors = ["bintis"]
license = "GPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "uta_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri CLI enables this for packaged builds. The Nix derivation invokes
# Cargo directly, so it must opt in to embed `frontendDist` instead of
# loading the development server from `devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# App Core
app-core = { package = "uta-studio-core", path = "../../app-core" }

# Dependencies
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gstreamer = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
