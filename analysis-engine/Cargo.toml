[package]
name = "uta-analysis-engine"
version = "0.8.3"
authors = ["bintis"]
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "uta_analysis_engine"

[[bin]]
name = "uta-analyze"
path = "src/bin/uta-analyze.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uta-runtime-manager = { path = "../runtime-manager" }
utz = { path = "../vendor/utz" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
