[package]
name = "uta-studio-desktop"
version = "0.8.4"
description = "Bevy desktop application for Uta! Studio."
authors = ["bintis"]
license = "GPL-3.0"
edition = "2024"

[[bin]]
name = "uta-studio"
path = "src/main.rs"

[dependencies]
app-core = { package = "uta-studio-core", path = "../app-core" }
bevy = { version = "0.19.1", default-features = false, features = [
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gilrs",
  "bevy_image",
  "bevy_input_focus",
  "bevy_log",
  "bevy_picking",
  "bevy_render",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "bevy_window",
  "bevy_winit",
  "jpeg",
  "multi_threaded",
  "png",
  "std",
  "ui_picking",
  "wayland",
] }
# COSMIC currently disconnects this application's Vulkan Wayland surface under
# sustained UI interaction. Keep a native Wayland GLES renderer available as a
# compositor-specific compatibility path; this does not enable X11/XWayland.
bevy_render = { version = "0.19.1", features = ["gles"] }
# Keep ICU diagnostics in the normal logger, including debug builds. Missing
# segmentation data is fixed by the Parley source patch, not a target filter.
icu_provider = { version = "=2.3.1", features = ["logging"] }
open = "=5.4.4"
# Use the Wayland XDG portal directly; no GTK or X11 file picker backend.
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6", "wayland", "xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real app-log capture (Node Context Menu "View logs"): a custom
# `LogPlugin.custom_layer` writer feeding `app_core::applog`'s ring buffer,
# reusing `tracing_subscriber::fmt`'s own event formatting rather than
# reimplementing it. Already a transitive dependency via `bevy_log`; pinned
# to the same 0.3 line so the `Layer<Registry>` impl is the same type Bevy
# expects.
tracing-subscriber = "0.3"
uta-studio-audio = { path = "../native-audio" }
uta-studio-diagnostics = { path = "../studio-diagnostics" }
