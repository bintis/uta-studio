[package]
name = "uta-qwen-worker"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "uta-qwen-asr-worker"
path = "src/bin/asr.rs"

[[bin]]
name = "uta-qwen-align-worker"
path = "src/bin/align.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
