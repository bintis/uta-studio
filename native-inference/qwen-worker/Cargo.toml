[package]
name = "uta-qwen-worker"
version = "0.8.2"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "uta-qwen-asr-worker"
path = "src/bin/asr.rs"

[[bin]]
name = "uta-qwen-align-worker"
path = "src/bin/align.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
