[package]
name = "uta-stars-worker"
version = "0.8.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "uta-stars-worker"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
gemm = { version = "0.19" }
num_cpus = "1"
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
