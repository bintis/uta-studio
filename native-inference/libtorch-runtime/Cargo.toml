[package]
name = "uta-libtorch-runtime"
version = "0.8.4"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
# Shared host DSP, decoding and evidence types only. LibTorch requests never
# construct GgmlRuntime or execute a GGML graph.
uta-ggml-runtime = { path = "../ggml-runtime" }

