[package]
name = "uta-libtorch-runtime"
version = "0.8.4"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rustfft = "6.4"
unicode-normalization = "0.1"
# Shared canonical host DSP/decoding and evidence types only. These callbacks
# never construct a GGML runtime or invoke its learned model graphs.
uta-ggml-runtime = { path = "../ggml-runtime" }

