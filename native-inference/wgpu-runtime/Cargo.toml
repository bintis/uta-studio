[package]
name = "uta-wgpu-runtime"
version = "0.8.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
default = []
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "=0.4.0", optional = true }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }
