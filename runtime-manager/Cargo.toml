[package]
name = "uta-runtime-manager"
version = "0.6.0"
authors = ["bintis"]
edition = "2024"
license = "GPL-3.0-only"
description = "Verified native model and runtime lifecycle manager for Uta! Studio"

[lib]
name = "uta_runtime_manager"

[[bin]]
name = "uta-runtime"
path = "src/bin/uta-runtime.rs"

[dependencies]
blake3 = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
